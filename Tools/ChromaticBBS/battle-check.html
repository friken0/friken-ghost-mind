<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LIFE WAR / production component audition</title><link rel="stylesheet" href="carrier.css"><style>html,body{margin:0;background:#050b10;color:#c9f8ee;font:12px monospace}#lab{padding:8px;display:flex;gap:8px;flex-wrap:wrap}#lab button{background:#061a1d;color:#c9f8ee;border:1px solid #125357;padding:8px}#result{white-space:pre-wrap;padding:8px}#chromatic-carrier{height:760px;max-height:calc(100vh - 100px);width:100%;max-width:1200px;padding:10px;display:flex}#cg-roll-battle{width:100%}</style>
<div id="lab"><button id="pass">PLAY / BREAKTHROUGH</button><button id="fail">PLAY / REALITY HOLDS</button><button id="exact">PLAY / EXACT STRIKE</button><button id="clash">FRAME / HOLD CLASH</button><button id="run">RUN BATTLE CHECKS</button><button id="mute">SFX: ON</button></div><div id="host"></div><pre id="result" role="status">Loading production battle component…</pre>
<script type="module">
import {mountRollBattle} from './roll-battle.mjs';import {mountAudio} from './audio.mjs';import {causalResult} from './causality.mjs';
const doc=new DOMParser().parseFromString(await(await fetch('surface.html')).text(),'text/html'),root=doc.querySelector('#chromatic-carrier'),battleNode=root.querySelector('#cg-roll-battle');root.replaceChildren(battleNode);document.querySelector('#host').append(root);
const output=document.querySelector('#result'),silent=new URL(location.href).searchParams.get('qaAudio')==='silent',audio=mountAudio(root,{silent,frame(bands,level){root.dataset.sfxPeak=String(Math.max(Number(root.dataset.sfxPeak||0),level));}}),battle=mountRollBattle(root,()=>{output.textContent='Closed. No player state was loaded or changed.';},{audio}),el=id=>root.querySelector('#cg-roll-'+id),paint=()=>new Promise(r=>requestAnimationFrame(()=>requestAnimationFrame(r)));
const policy={precision:2,below:.2,above:.3,bonus:{signal:1}};const receipts={pass:{label:'HOLD THE LINE / BREAKTHROUGH',roll:{...causalResult(15.74,6,17.2,policy),stat:'focus'}},fail:{label:'HOLD THE LINE / REALITY HOLDS',roll:{...causalResult(4.12,6,17.2,policy),stat:'focus'}},exact:{label:'HOLD THE LINE / EXACT STRIKE',roll:{...causalResult(11.15,6,17.2,policy),stat:'focus'}}};
let clashTimer=0;async function show(kind){clearTimeout(clashTimer);if(!silent)await audio.unlock();battle.show(receipts[kind],{comment:'Ghost: Two microscopic civilisations arguing over your terrible idea. Try to look worth it.'});output.textContent='Real component / synthetic receipt / no player saves. Cyan squares = you; magenta diamonds = reality.';}
document.querySelector('#clash').onclick=async()=>{await show('exact');clashTimer=setTimeout(()=>battle.hold(true),8050);};
for(const k of ['pass','fail','exact'])document.querySelector('#'+k).onclick=()=>show(k);let muted=false;document.querySelector('#mute').onclick=()=>{muted=!muted;audio.sfx(!muted);document.querySelector('#mute').textContent='SFX: '+(muted?'OFF':'ON');};
output.textContent='Ready. These controls audition the actual production theater and mixer, with fixed test receipts.';
document.querySelector('#run').onclick=async()=>{const checks=[];const ok=(x,label)=>{if(!x)throw Error(label);checks.push(label);};try{
 for(const width of [320,650,900,1200]){root.style.width=width+'px';for(const kind of ['pass','fail','exact']){await show(kind);const until=performance.now()+2000;while(Number(el('canvas').dataset.lifeGeneration)<4){if(performance.now()>until)throw Error('Simulation deadline');await paint();}el('pause').click();const generation=el('canvas').dataset.lifeGeneration,population=el('canvas').dataset.population,cues=audio.info.battle.cues;await new Promise(r=>setTimeout(r,150));ok(el('canvas').dataset.lifeGeneration===generation&&el('canvas').dataset.population===population,'Held cells '+width+'/'+kind);ok(audio.info.battle.cues===cues&&audio.info.battle.voices===0,'Held sound '+width+'/'+kind);el('finish').click();await paint();ok(el('canvas').dataset.lifeGeneration==='90'&&!el('continue').hidden,'Held result '+width+'/'+kind);ok(el('force').textContent===receipts[kind].roll.total.toFixed(2)&&el('target').textContent===receipts[kind].roll.dc.toFixed(2),'Locked math '+width+'/'+kind);ok(audio.info.battle.cues===cues,'Finish emits no skipped cue burst '+width+'/'+kind);const end=el('canvas').dataset.population;el('replay').click();el('finish').click();await paint();ok(el('canvas').dataset.population===end,'Exact simulation replay '+width+'/'+kind);ok([...root.querySelectorAll('strong,button')].filter(n=>!n.hidden&&n.checkVisibility()).every(n=>n.getBoundingClientRect().right<=root.getBoundingClientRect().right+1),'Scoreboard and controls fit '+width+'/'+kind);}
 }
 root.style.width='100%';output.textContent='PASS '+checks.length+' assertions\n'+checks.join('\n');root.dataset.qa='pass';
 }catch(e){output.textContent='FAIL '+e.message+'\n'+checks.join('\n');root.dataset.qa='fail';}};
</script></html>
