<!doctype html><html lang="en"><meta charset="utf-8"><title>Ghost chapter handoff acceptance</title><style>body{background:#090b17;color:#b5fff4;font:14px monospace}iframe{width:100%;height:900px;border:0}pre{white-space:pre-wrap}</style><button id="run">Run chapter handoff checks</button><pre id="result" role="status">Not run</pre><iframe id="frame" title="Chapter specimen"></iframe><script>
const frame=document.getElementById('frame'),out=document.getElementById('result'),lines=[];let namespace='chapter-'+Date.now();
const get=id=>frame.contentDocument.getElementById('cg-'+id),root=()=>frame.contentDocument.getElementById('chromatic-carrier'),state=()=>root().chromatic.state;
function assert(ok,msg){if(!ok)throw Error(msg);lines.push(msg);out.textContent=lines.join('\n');}
const paint=()=>{frame.scrollIntoView({block:'start'});return new Promise(r=>frame.contentWindow.requestAnimationFrame(()=>frame.contentWindow.requestAnimationFrame(()=>frame.contentWindow.requestAnimationFrame(r))));};
async function load(){await new Promise(r=>{frame.onload=r;frame.src='index.html?qaStore='+namespace});get('skip').click();get('continue').click();let until=Date.now()+7000;while(root().dataset.power!=='ready'){if(Date.now()>until)throw Error('Boot timeout');await paint();}await paint();}
function exact(){return JSON.stringify(state());}
document.getElementById('run').onclick=async()=>{try{lines.length=0;const [seed,pack]=await Promise.all([fetch('fixtures/c26-2-completed.seed').then(r=>r.text()),fetch('chapters/the-weather-inside.json').then(r=>r.json())]);await load();assert(get('title').textContent==='WELL. YOU’RE ON THE OUTSIDE.','Every boot starts with Ghost meeting');get('seed').value=seed.trim();get('load').click();const parent=exact();get('canon-local').click();get('canon-select').click();get('next').click();assert(exact()===parent,'Next chapter preserves the ending instead of replaying it');assert(JSON.parse(get('chapter-request').value).nextChapter===2,'Exact continuation request is available');get('chapter-pack').value=JSON.stringify({...pack,parent:'00000000'});get('chapter-load').click();assert(exact()===parent,'Wrong-parent chapter refused atomically');get('chapter-pack').value=JSON.stringify(pack);get('chapter-load').click();await paint();assert(state().chapter===2&&state().turn===1&&state().pack.id==='the-weather-inside','Fresh model-authored chapter admitted');assert(get('title').textContent==='CUSTOMS FOR UNLICENSED RAIN','Actual new story appears in the existing wrapper');assert(get('canvas').dataset.renderer==='generated-csg'&&get('canvas').dataset.recipe,'New CSG recipe uses actual renderer '+JSON.stringify({...get('canvas').dataset})+' / '+get('art-status').textContent);const gl=get('canvas').getContext('webgl'),pixel=new Uint8Array(gl.drawingBufferWidth*gl.drawingBufferHeight*4);gl.readPixels(0,0,gl.drawingBufferWidth,gl.drawingBufferHeight,gl.RGBA,gl.UNSIGNED_BYTE,pixel);assert(pixel.some((v,i)=>i%4!==3&&v>60),'New CSG canvas contains rendered colour pixels');const initial=exact();get('inspect-sdf').click();await paint();assert(get('canvas').checkVisibility()&&get('canvas').getBoundingClientRect().height>100,'Generated relic remains visible expanded');get('inspect-back').click();assert(exact()===initial,'Generated art inspection spends no decision');
for(let i=0;i<12;i++){const before=state().turn;frame.contentDocument.querySelector('#cg-choices [data-choice]').click();await paint();if(root().dataset.roll==='open'){assert(get('roll-battle').dataset.theater==='balance','Chapter selected the new balance theater');const locked=exact();get('roll-finish').click();assert(exact()===locked,'New roller cannot change committed receipt');get('roll-continue').click();await paint();}assert(state().turn===before+1,'Generated decision '+(i+1)+' commits exactly once');}
assert(state().ending&&state().turn===13,'New twelve-decision story ends');assert(state().modules.some(m=>m.id==='weather'&&m.uses>=2),'New WEATHER law installed and exercised twice');assert(get('seed').value.startsWith('FGC2.'),'Cold-boot seed retains generated chapter content');const complete=exact();get('session-share').click();assert(get('session-status').textContent.includes('consent'),'Public projection requires consent');get('dispatch-consent').checked=true;get('session-share').click();const pub=get('public-session').value;assert(JSON.parse(pub).turns===12&&!pub.includes('FGC2.'),'Public projection excludes private seed and chapter source');assert(get('session-link').href.includes('github.com/friken0/friken-ghost-mind/issues/new'),'Real authenticated public intake composer is wired');await load();assert(get('title').textContent==='WELL. YOU’RE ON THE OUTSIDE.','Returning boot still meets Ghost before resume');get('resume').click();assert(exact()===complete,'Native save reload restores exact new chapter and receipts');get('canon-local').click();get('canon-select').click();get('next').click();assert(JSON.parse(get('chapter-request').value).nextChapter===3&&exact()===complete,'Chapter three waits for another real new plot');const preserved=exact();get('canon-manifest').value=JSON.stringify({schema:'friken.ghost.canon.v1',path:[{chapter:1,tellingId:'a'.repeat(64)}]});get('canon-import').click();get('canon-local').click();assert(get('chapter-fork').disabled,'Conflicting ancestry disables replay');assert(frame.contentDocument.querySelectorAll('.cg-canon-node[data-branch=ghost]').length>0,'Incompatible descendants remain visible as grey ghost nodes');get('next').click();assert(get('seed-status').textContent.includes('Handoff refused'),'Conflicting canon refuses next-chapter request');assert(exact()===preserved,'Changing canon never mutates or deletes the saved telling');get('canon-adopt').click();get('canon-select').click();assert(JSON.parse(get('canon-manifest').value).path.length===2,'Explicit ancestry adoption and ending selection restore exact two-chapter canon');assert(!get('chapter-fork').disabled,'Matching branch replay unlocks after explicit canon choice');out.textContent+='\nPASS / '+lines.length+' chapter assertions';}catch(e){out.textContent+='\nFAIL / '+e.stack;}};
</script></html>
