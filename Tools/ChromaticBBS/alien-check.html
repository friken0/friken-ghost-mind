<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>XENO / translation and vocal audition</title><link rel="stylesheet" href="carrier.css"><style>html,body{margin:0;background:#050b10;color:#c9f8ee;font:13px monospace}#lab{display:flex;gap:8px;flex-wrap:wrap;padding:8px}#lab button{padding:8px;background:#061a1d;color:#c9f8ee;border:1px solid #125357}#chromatic-carrier{height:calc(100vh - 90px);padding:12px;max-width:1200px}#cg-inspect-slot{height:100%;overflow:auto;display:block}#result{white-space:pre-wrap;padding:8px}#cg-alien-call{margin:0}#cg-resident-art{display:none}</style>
<div id="lab"><button id="harkellinia">HEAR / HARKELLINIA</button><button id="krex">HEAR / KREX</button><button id="moknon">HEAR / MOKNON</button><button id="quiet">QUIET</button><button id="run">CHECK PLAYBACK + CANCELLATION</button></div><div id="chromatic-carrier" data-theme="cyan" data-inspect="alien"><img id="cg-resident-art" alt=""><div id="cg-inspect-slot" class="cg-prose"></div></div><pre id="result" role="status">Loading real chapter transmissions…</pre>
<script type="module">
import {mountAlienComms,renderAlienUtterance} from './alien-comms.mjs';import {mountAudio} from './audio.mjs';
const root=document.querySelector('#chromatic-carrier'),output=document.querySelector('#result'),pack=await(await fetch('chapters/lot-forty-seven.json')).json(),fixtures=Object.fromEntries(['harkellinia','krex','moknon'].map(race=>[race,pack.scenes.find(s=>s.transmission?.race===race).transmission]));
const audio=mountAudio(root,{frame(bands,level){root.dataset.peak=String(Math.max(Number(root.dataset.peak||0),level));}});let receiver;receiver=mountAlienComms(root,{audio,stopSpeech:()=>receiver.stop(),openView(){root.dataset.inspect='alien';},note:s=>output.textContent=s});
for(const race of Object.keys(fixtures))document.querySelector('#'+race).onclick=()=>{receiver.show(fixtures[race]);output.textContent='Original art / authored decoder estimate / procedural alien speech. No English TTS, no player save.';void receiver.play();};document.querySelector('#quiet').onclick=()=>receiver.stop();receiver.show(fixtures.harkellinia);output.textContent='Ready. Click a species to hear the production Masha-derived formant generator.';
document.querySelector('#run').onclick=async()=>{const checks=[],ok=(x,s)=>{if(!x)throw Error(s);checks.push(s);},wait=ms=>new Promise(r=>setTimeout(r,ms));try{
 await audio.unlock();receiver.show(fixtures.harkellinia);const playing=receiver.play();const until=performance.now()+2500;while(root.querySelector('#cg-alien-call').dataset.phase!=='speaking'){if(performance.now()>until)throw Error('Alien playback deadline');await wait(25);}await wait(200);ok(Number(root.querySelector('#cg-alien-call').dataset.peak)>0,'Actual PCM playback envelope');receiver.stop();await playing;ok(root.querySelector('#cg-alien-call').dataset.phase==='held','Cancellation resolves pending playback');
 for(const race of Object.keys(fixtures)){receiver.show(fixtures[race]);const before=root.querySelector('#cg-alien-accuracy').textContent;const a=renderAlienUtterance(fixtures[race],16000),b=renderAlienUtterance(fixtures[race],16000);ok(a.samples.length===b.samples.length&&a.samples.every((v,i)=>v===b.samples[i]),race+' deterministic replay');ok(a.duration<12,race+' finite duration');const p=receiver.play();await wait(100);receiver.stop();await p;ok(root.querySelector('#cg-alien-accuracy').textContent===before,race+' replay never upgrades accuracy');}
 const injection=structuredClone(fixtures.krex);injection.lines[0].text='<img src=x onerror=alert(1)>';receiver.show(injection);ok(root.querySelector('#cg-alien-caption').textContent.includes('<img')&&!root.querySelector('#cg-alien-caption img'),'Imported dialogue stays literal text');receiver.show(fixtures.moknon);output.textContent='PASS '+checks.length+' assertions\n'+checks.join('\n');root.dataset.qa='pass';
 }catch(e){output.textContent='FAIL '+e.message+'\n'+checks.join('\n');root.dataset.qa='fail';}};
</script></html>
