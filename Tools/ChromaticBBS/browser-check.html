<!doctype html><meta charset="utf-8"><title>C26.11 human carrier acceptance</title><style>body{font:14px monospace;background:#080e0b;color:#d7eee0}iframe{display:block;border:0;height:900px}pre{white-space:pre-wrap}</style><button id="run">Run browser checks</button><pre id="result" role="status">Not run</pre><iframe id="specimen" title="Isolated carrier"></iframe>
<script>
const frame=document.querySelector('iframe'),output=document.querySelector('pre'),receipts=[];const el=id=>frame.contentDocument.getElementById('cg-'+id),root=()=>frame.contentDocument.getElementById('chromatic-carrier'),state=()=>JSON.stringify(root().chromatic.state),paint=()=>new Promise(r=>frame.contentWindow.requestAnimationFrame(()=>frame.contentWindow.requestAnimationFrame(r)));
function ok(v,label){if(!v)throw Error(label);receipts.push(label);output.textContent=receipts.join('\n');}
async function waitReady(){const until=performance.now()+6000;while(root().dataset.power!=='ready'){if(performance.now()>until)throw Error('Assembly deadline');await paint();}}
function bounds(width){return [...frame.contentDocument.querySelectorAll('#chromatic-carrier *')].filter(n=>n.checkVisibility({checkVisibilityCSS:true})&&getComputedStyle(n).position!=='absolute').filter(n=>{const r=n.getBoundingClientRect();return r.left<-.6||r.right>width+.6;}).map(n=>n.id||n.className);}
async function settle(){if(root().dataset.roll!=='open')return;const before=state();const until=performance.now()+2500;while(Number(el('roll-canvas').dataset.lifeGeneration||0)<3){if(performance.now()>until)throw Error('Live Conway animation failed to advance');await paint();}ok(Number(el('roll-canvas').dataset.lifeGeneration)>=3,'Living field advances before Finish');el('roll-pause').click();el('roll-finish').click();await paint();ok(!el('roll-continue').hidden,'Living field holds result');ok(state()===before,'Finish/pause do not change the receipt');ok(el('roll-canvas').dataset.lifeGeneration==='90','Real finite Conway generations rendered');el('roll-replay').click();await paint();ok(state()===before,'Replay retains exact sample and RNG');el('roll-finish').click();el('roll-continue').click();await paint();}
document.querySelector('button').onclick=async()=>{receipts.length=0;try{
for(const width of [320,650,900,1440]){
 frame.width=width;await new Promise(r=>{frame.onload=r;frame.src='index.html?check=human-'+width+'&qaAudio=silent';});await paint();await paint();ok(el('boot-world').dataset.shader==='ready',width+': Signal Dock shader compiled');ok(el('boot-world').dataset.renderer==='webgl-sdf',width+': real SDF renderer');ok(Number(el('boot-world').dataset.frames)>0,width+': boot scene draws real frames');const ink=el('boot-canvas'),inkCtx=ink.getContext('2d');ok(ink.dataset.overlay==='full-glass-grey-gradient'&&inkCtx.getImageData(ink.width>>1,0,1,1).data[3]===0&&inkCtx.getImageData(ink.width>>1,ink.height-1,1,1).data[3]===255,width+': full-glass terminal is clear above and solid below / '+ink.dataset.overlay+' / '+inkCtx.getImageData(ink.width>>1,0,1,1).data[3]+' -> '+inkCtx.getImageData(ink.width>>1,ink.height-1,1,1).data[3]);ok(el('boot-music').textContent==='MUSIC: OFF',width+': music defaults off before connection');
 const cameraCode=await import('./boot-world.mjs');const dock=el('boot-world'),field=el('boot-field');
 async function focusWait(name){const until=performance.now()+3500;while(dock.dataset.focus!==name){if(performance.now()>until)throw Error('Hover focus '+name+' deadline');await paint();}await new Promise(r=>setTimeout(r,250));}
 for(const [name,point]of [['modem',[0,-.25,-.7]],['portal',[0,.95,3.8]]]){
  const rect=dock.getBoundingClientRect(),camera={eye:dock.dataset.eye.split(',').map(Number),look:dock.dataset.look.split(',').map(Number),lens:Number(dock.dataset.lens)},uv=cameraCode.bootProject(point,camera,rect.width/rect.height);
  field.dispatchEvent(new frame.contentWindow.PointerEvent('pointermove',{bubbles:true,pointerType:'mouse',clientX:rect.left+(uv[0]+1)*rect.width/2,clientY:rect.top+(1-uv[1])*rect.height/2}));await focusWait(name);ok(dock.dataset.focus===name,width+': pointer ray focuses '+name);
  el('view-wide').click();await focusWait('wide');await new Promise(r=>setTimeout(r,1100));
 }
 el('dial').click();await paint();el('pause').click();await paint();const heldEye=dock.dataset.eye;el('view-modem').click();await new Promise(r=>setTimeout(r,200));ok(dock.dataset.eye===heldEye&&dock.dataset.held==='true',width+': held camera does not drift');
 el('skip').click();const virgin=state();ok(root().dataset.power==='awaiting',width+': boot holds Continue');el('continue').click();await waitReady();ok(state()===virgin,width+': assembly spends no decision');
 ok(Object.keys(root().chromatic.state.stats).length===5,width+': five real attributes');ok(el('attributes').children.length===5,width+': visible stat rail');ok(!frame.contentDocument.querySelector('.cg-window-nav').textContent.includes('null'),'No detached controls appended as null');ok(el('sound').textContent==='SFX: on'&&el('voice').textContent==='Voice: on',width+': controls default on');ok(bounds(width).length===0,width+': layout contained '+bounds(width));ok(frame.contentDocument.documentElement.scrollHeight<=frame.contentWindow.innerHeight+2,width+': no outer scroll');ok(el('portrait').dataset.state==='ready',width+': canonical face compiled');ok(el('resident-art').complete&&el('resident-art').naturalWidth>0,width+': original human art decoded');
 el('meet-rules').click();ok(state()===virgin,width+': teaching spends no turn');ok(el('ghost').textContent.includes('resonance'),width+': decimal rules taught');el('meet-who').click();ok(state()===virgin,width+': identity meeting spends no turn');
 for(const type of ['face','sdf']){el('inspect-'+type).click();await paint();const c=el(type==='face'?'portrait':'canvas');ok(c.checkVisibility({checkVisibilityCSS:true})&&c.getBoundingClientRect().height>100,width+': '+type+' inspector painted');ok(el('inspect-back').checkVisibility({checkVisibilityCSS:true}),width+': inspector Back visible');if(type==='face'){const slot=el('inspect-slot').getBoundingClientRect(),face=c.getBoundingClientRect();ok(face.width>=Math.min(slot.width,slot.height)*.94&&face.width<=slot.width+1&&face.height<=slot.height+1,width+': enlarged face fills available stage');}el('inspect-back').click();await paint();ok(state()===virgin,width+': inspection unchanged');}
 const beforeRoll=root().chromatic.state.creation.seed;el('reroll-stats').click();ok(root().chromatic.state.creation.seed!==beforeRoll,width+': explicit creation reroll');el('start').click();await paint();ok(el('resident-art').alt.includes('harkellinia'),width+': resident art follows known contact');ok(el('choices').children.length===3,width+': three choices');ok(el('attributes').getBoundingClientRect().top<el('title').getBoundingClientRect().top,width+': stats above story');
 for(let t=0;t<12;t++){const buttons=[...el('choices').querySelectorAll('button')];buttons[buttons.length-1].click();await paint();await settle();}
 ok(!!root().chromatic.state.ending,width+': twelve choices finish chapter');ok(!el('completion').hidden,width+': visible completion summary');el('choices').querySelector('button').click();await paint();ok(root().dataset.window==='archive'&&el('chapter-handoff').open,width+': next chapter opens real handoff');ok(el('chapter-request').value.includes('AUTHOR_NEXT_CHAPTER'),width+': next prompt carries exact seed');
}
output.textContent='PASS '+receipts.length+' assertions\n'+receipts.join('\n');}catch(e){output.textContent='FAIL '+e.message+'\n'+receipts.join('\n');}};
</script>
